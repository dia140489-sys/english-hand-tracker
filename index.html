<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Catch English Words — Hand Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#10172d;color:white;font-family:system-ui,Arial;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:18px;margin:0}.pill{background:#293656;border-radius:16px;padding:8px;font-weight:bold}#task{background:#253a70;border-radius:16px;padding:12px;text-align:center;font-size:19px}#task b{color:#fbd46d}#arena{position:relative;flex:1;min-height:200px;overflow:hidden;border:2px solid #4c65a0;border-radius:18px;background:radial-gradient(circle at 50% 35%,#263f73,#131b34);touch-action:none}.word{position:absolute;border-radius:30px;padding:14px 18px;font-size:20px;font-weight:750;background:#e9f2ff;color:#142249;box-shadow:0 6px 0 #879ac7;white-space:nowrap;transform:translate(-50%,-50%);user-select:none}.word.good{background:#79e8ad}.word.bad{background:#ffa0a0}#cursor{position:absolute;width:35px;height:35px;border:4px solid #ffe56d;background:#ffe56d55;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:5}#status{font-size:13px;color:#c4d5ff;text-align:center;min-height:20px}#controls{display:flex;gap:7px;flex-wrap:wrap}button,select{border:0;border-radius:12px;padding:11px;font-size:15px;font-weight:bold}button{background:#fbd46d;color:#16213e;flex:1}select{background:#dce7ff;color:#17254a;flex:1}#preview{position:absolute;right:8px;bottom:8px;width:96px;height:72px;object-fit:cover;border-radius:10px;opacity:.65;transform:scaleX(-1);pointer-events:none}#help{font-size:12px;color:#c9d6f8;text-align:center}#result{position:absolute;inset:0;background:#10172de9;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:25px}#result h2{font-size:28px}#result button{flex:0;width:220px}</style></head><body><div id="app"><header><h1>✋ Catch English Words</h1><span class="pill" id="score">⭐ 0</span><span class="pill" id="count">0/10</span></header><div id="task">Выберите тему и нажмите «Начать»</div><div id="controls"><select id="topic"><option value="animals">🐾 Animals</option><option value="family">👨‍👩‍👧 Family</option><option value="school">📚 School</option><option value="colours">🎨 Colours</option></select><button id="start">▶ Начать</button><button id="camera">📷 Камера</button></div><div id="arena"><video id="preview" autoplay playsinline muted></video><div id="cursor"></div><div id="result"><h2 id="resultText"></h2><button id="again">Играть снова</button></div></div><div id="status">Режим касания доступен сразу. Для управления рукой включите камеру.</div><div id="help">Коснитесь нужного слова пальцем или наведите на него указательный палец перед камерой и удерживайте ~0,7 секунды.</div></div><script type="module">
const DATA={animals:[['кошка','cat'],['собака','dog'],['птица','bird'],['рыба','fish'],['лошадь','horse'],['корова','cow'],['лев','lion'],['тигр','tiger'],['кролик','rabbit'],['слон','elephant']],family:[['мама','mother'],['папа','father'],['сестра','sister'],['брат','brother'],['бабушка','grandmother'],['дедушка','grandfather'],['тётя','aunt'],['дядя','uncle'],['двоюродный брат или сестра','cousin'],['семья','family']],school:[['книга','book'],['ручка','pen'],['карандаш','pencil'],['линейка','ruler'],['парта','desk'],['стул','chair'],['учитель','teacher'],['ученик','pupil'],['сумка','bag'],['тетрадь','notebook']],colours:[['красный','red'],['синий','blue'],['зелёный','green'],['жёлтый','yellow'],['чёрный','black'],['белый','white'],['розовый','pink'],['фиолетовый','purple'],['оранжевый','orange'],['коричневый','brown']]};
const $=s=>document.querySelector(s),arena=$('#arena'),cursor=$('#cursor');let items=[],nodes=[],round=0,score=0,playing=false,last=0,tracker=null,stream=null,hover=null,hoverStart=0,raf=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function reset(){nodes.forEach(n=>n.el.remove());nodes=[];round=0;score=0;playing=true;items=shuffle(DATA[$('#topic').value]);$('#result').style.display='none';update();next()}
function update(){$('#score').textContent='⭐ '+score;$('#count').textContent=round+'/10'}
function next(){nodes.forEach(n=>n.el.remove());nodes=[];if(round>=10){playing=false;$('#resultText').textContent='Отлично! Результат: '+score+' из 10';$('#result').style.display='flex';return}const answer=items[round];$('#task').innerHTML='Поймай слово: <b>'+answer[0]+'</b>';const pool=shuffle(DATA[$('#topic').value].filter(x=>x[1]!==answer[1])).slice(0,3).concat([answer]);shuffle(pool).forEach((x,i)=>{const el=document.createElement('div');el.className='word';el.textContent=x[1];arena.appendChild(el);nodes.push({el,answer:x[1]===answer[1],x:.2+(i%2)*.6,y:.17+Math.floor(i/2)*.33,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.12})});hover=null}
function choose(n){if(!playing||!n||n.lock)return;n.lock=true;if(n.answer){score++;n.el.classList.add('good');$('#status').textContent='✅ Правильно!';}else{n.el.classList.add('bad');$('#status').textContent='❌ Попробуй следующее слово!';}round++;update();setTimeout(next,650)}
function frame(t){let dt=Math.min((t-last)/1000||0,.06);last=t;const w=arena.clientWidth,h=arena.clientHeight;for(const n of nodes){n.x+=n.vx*dt;n.y+=n.vy*dt;const hw=Math.min(.35,(n.el.offsetWidth/2+8)/w),hh=(n.el.offsetHeight/2+8)/h;if(n.x<hw||n.x>1-hw)n.vx*=-1;if(n.y<hh||n.y>1-hh)n.vy*=-1;n.x=Math.max(hw,Math.min(1-hw,n.x));n.y=Math.max(hh,Math.min(1-hh,n.y));n.el.style.left=n.x*w+'px';n.el.style.top=n.y*h+'px'}raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);
arena.addEventListener('pointerdown',e=>{if(e.target.classList.contains('word')){const n=nodes.find(n=>n.el===e.target);choose(n)}});$('#start').onclick=reset;$('#again').onclick=reset;
async function enableCamera(){try{if(!window.isSecureContext)throw Error('Камера работает только на HTTPS или localhost.');$('#status').textContent='Загрузка распознавания руки…';const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await lib.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');tracker=await lib.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});const v=$('#preview');v.srcObject=stream;await v.play();$('#status').textContent='✋ Камера включена. Покажите указательный палец.';let prev=-1;async function detect(){if(!stream)return;try{if(v.readyState>=2&&v.currentTime!==prev){prev=v.currentTime;const res=tracker.detectForVideo(v,performance.now());const p=res.landmarks?.[0]?.[8];if(p){const x=(1-p.x)*arena.clientWidth,y=p.y*arena.clientHeight;cursor.style.display='block';cursor.style.left=x+'px';cursor.style.top=y+'px';const n=nodes.find(n=>{const r=n.el.getBoundingClientRect(),a=arena.getBoundingClientRect();return x>=r.left-a.left&&x<=r.right-a.left&&y>=r.top-a.top&&y<=r.bottom-a.top});if(n){if(hover!==n){hover=n;hoverStart=performance.now()}else if(performance.now()-hoverStart>700){choose(n);hover=null}}else hover=null}else{cursor.style.display='none';hover=null}}}catch(e){console.warn(e)}requestAnimationFrame(detect)}detect()}catch(e){$('#status').textContent='⚠️ '+e.message+' Можно играть касанием экрана.';console.error(e)}}$('#camera').onclick=enableCamera;window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());cancelAnimationFrame(raf)});
</script></body></html>
